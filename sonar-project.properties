# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_waste-movement-api
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/waste-movement-api
sonar.links.ci=https://github.com/DEFRA/waste-movement-api/actions
sonar.links.scm=https://github.com/DEFRA/waste-movement-api
sonar.links.issue=https://github.com/DEFRA/waste-movement-api/issues

# Test support code that lives beside what it tests (shared fixtures, fixture
# schemas) is test code too, not source to analyse as production code
sonar.sources=src/
sonar.exclusions=src/**/*.test.js,src/**/test-helpers.js,src/**/test-fixtures/**
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js,src/**/test-helpers.js,src/**/test-fixtures/**

sonar.javascript.lcov.reportPaths=./coverage/lcov.info
